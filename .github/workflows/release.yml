name: Legacy Release (Linux / macOS Python 0.8.x)

# Legacy Python packaging workflow kept for manual Linux / macOS builds only.
# Windows x64 0.9.0+ is native Rust + Slint + whisper.cpp 1.8.4 — built by
# .github/workflows/rust-windows.yml and published via `gh release create`.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: System deps (PortAudio, xvfb, AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xvfb libfuse2
          wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            && sudo chmod +x /usr/local/bin/appimagetool || echo "appimagetool unavailable"

      - name: Create venv and install deps
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements-lock.txt

      - name: Smoke gate (headless X)
        run: xvfb-run -a venv/bin/python run.py --smoke

      - name: Build tar.gz (+ AppImage best-effort)
        run: bash packaging/linux/build.sh

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Eqho ${{ github.ref_name }}
          files: |
            dist/Eqho-linux-*.tar.gz
            dist/Eqho-*.AppImage

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eqho-linux
          path: |
            dist/Eqho-linux-*.tar.gz
            dist/Eqho-*.AppImage
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Create venv and install deps
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements-lock.txt

      - name: Smoke gate
        run: venv/bin/python run.py --smoke

      - name: Build .app + dmg
        run: bash packaging/macos/build.sh

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Eqho ${{ github.ref_name }}
          files: dist/Eqho-macos-*.dmg

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eqho-macos
          path: dist/Eqho-macos-*.dmg
