ShortDescription: Free, offline voice-to-text dictation. Press a hotkey, speak, and your words appear in any app — 100% local, powered by Whisper.
Description: |-
  Eqho is an always-on dictation app that lives in your system tray. Press a
  global hotkey (default Alt+Q), speak naturally, and the transcribed text lands
  in whatever application is focused. Rebuilt in Rust around whisper.cpp, speech
  recognition runs entirely on your machine — no cloud, no account, no API keys.
  Accelerates on NVIDIA, AMD, and Intel graphics cards via Vulkan, and runs on
  multi-core CPUs with compact Q5 quantized models on any PC without a GPU.
  Includes a voice-reactive listening pill with hover/pinnable controls and
  Batch/Live delivery, 99 languages with vector flags, searchable local history,
  custom vocabulary, voice commands, and text replacements.
