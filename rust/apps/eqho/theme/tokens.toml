# Eqho design tokens — single source of truth for colours, radii, spacing and type sizes
# (matching docs/ai/DESIGN_SYSTEM.md and src/theme.py).
# Regenerate outputs with:
#   cargo run -p damt-theme --example gen -- apps/eqho/theme/tokens.toml apps/eqho/theme/generated

# --- Core palette ---------------------------------------------------------------------------

[color.bg]
light = "#F5F6F8"          # light gray canvas
dark = "#121215"           # rich obsidian-charcoal canvas (unified with Settings modal)

[color.surface]
light = "#FFFFFF"          # white cards, sidebar
dark = "#17171B"           # elevated cards, TopBar capsule, Settings modal pane

[color.surface-tertiary]
light = "#ECEDF0"          # inputs, nested surfaces
dark = "#202026"           # nested cards (ModelCard, SettingsGroup), inputs

[color.surface-hover]
light = "#E2E4E8"
dark = "#282830"

[color.text]
light = "#1A1C1F"          # primary text
dark = "#F5F6F8"

[color.text-muted]
light = "#4B4F58"          # secondary text (AA on Surface)
dark = "#A1A1AA"

[color.text-subtle]
light = "#74747E"          # hints, disabled text
dark = "#85858F"

[color.accent]
light = "#0969DA"          # Eqho light blue (5.19:1 with white on-accent, >3:1 on bg/surface)
dark = "#1A489B"           # Eqho dark Deep Navy Blend (8.59:1 AAA with white on-accent; borderless fills)

[color.accent-line]
light = "#0969DA"          # thin accent strokes, focus rings, selected outlines, progress bar tip
dark = "#58A6FF"           # bright Eqho accent for 1-2px lines, focus rings & progress leading edge (7.22:1 on surface)

[color.accent-text]
light = "#0969DA"          # links and small accent text
dark = "#58A6FF"

[color.accent-text-pressed]
light = "#0550AE"
dark = "#79B8FF"

[color.accent-muted]
light = "#DBEAFE"
dark = "#16283F"

[color.accent-selected]
light = "#B3D1F5"
dark = "#2258B8"

[color.on-accent]
light = "#FFFFFF"          # white on deep light-mode blue
dark = "#FFFFFF"           # crisp white on Deep Navy Blend (8.59:1 AAA)

[color.success]
light = "#1A7F37"
dark = "#3FB950"

[color.success-muted]
light = "#DAFBE1"
dark = "#1A3A2A"

[color.warning]
light = "#9A6700"
dark = "#D29922"

[color.warning-muted]
light = "#FFF8C5"
dark = "#3D2E00"

[color.error]
light = "#CF222E"
dark = "#F85149"

[color.attention]
light = "#9A6700"
dark = "#D29922"

# --- Derived colours & control borders ------------------------------------------------------

[color.border]
light = "#D4D6DC"
dark = "#303039"

[color.border-subtle]
light = "#E4E6EA"
dark = "#26262E"

[color.input-border]
ref = "text-muted"
alpha = { light = 0.70, dark = 0.60 }

[color.divider]
ref = "text"
alpha = 0.08

[color.progress-track]
ref = "text"
alpha = { light = 0.10, dark = 0.08 }

[color.button-outline-hover]
ref = "text"
alpha = 0.07

[color.button-outline-pressed]
ref = "text"
alpha = 0.12

[color.overlay-bg]
light = "#FFFFFF"
dark = "#17171B"

[color.overlay-fg]
light = "#1A1C1F"
dark = "#F5F6F8"

# --- Accent ramp & button states (all AA-verified against on-accent) ------------------------

[color.system-accent]
light = "#0969DA"
dark = "#1A489B"

[color.system-accent-light-1]
light = "#218BFF"
dark = "#2258B8"

[color.system-accent-dark-1]
light = "#0550AE"
dark = "#13377A"

[color.system-accent-dark-2]
light = "#033D8B"
dark = "#0E2A5E"

[color.button-accent-hover]
light = { ref = "system-accent-dark-1" }
dark = { ref = "system-accent-light-1" }

[color.button-accent-pressed]
light = { ref = "system-accent-dark-2" }
dark = { ref = "system-accent-dark-1" }

# --- Corner radii (px) ----------------------------------------------------------------------

[radius]
sm = 4
md = 6
lg = 8
xl = 12
card = 8
button = 4
toggle = 10

# --- Spacing scale (px) ---------------------------------------------------------------------

[space]
2 = 2
4 = 4
6 = 6
8 = 8
10 = 10
12 = 12
14 = 14
16 = 16
24 = 24
32 = 32

# --- Font sizes (px) ------------------------------------------------------------------------

[font.size]
xs = 10
sm = 11
help = 11
label = 13
base = 13
body = 13
lg = 15
xl = 17
title = 20
