[package]
name = "damt-platform-win"
description = "Windows implementations of the damt-platform OS-service contracts (idle, focus, session, autostart, screens, theme, motion)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
store = ["windows/Services_Store"]

[dependencies]
damt-platform.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["ApplicationModel", "Win32_Storage_Packaging_Appx"] }

[lints]
workspace = true
